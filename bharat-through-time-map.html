.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0}

function badge(c){return `<span class="badge">${CAT[c][0]}</span>`}
function side(){const A=active(y),q=$("q").value.toLowerCase();
if(sel){const d=D.find(x=>x.id==sel),ev=EV.filter(e=>e[0]>=d.s&&e[0]<=d.e);
$("side").innerHTML=`<button onclick="sel=null;side();draw()">← All active in ${fmt(y)}</button><h2 style="margin:10px 0 2px">${d.name}</h2>${badge(d.cat)} <span class="badge">Confidence: ${d.conf}</span>
<p><b>Dynasty:</b> ${d.dyn}<br><b>Approx. period:</b> c. ${fmt(d.s)} – ${fmt(d.e)}<br><b>Capital:</b> ${d.cap}</p>
<p>${d.note||"No additional uncertainty note."}</p><div class="sub">Shaded area (where shown): an INDICATIVE extent at the entity’s peak years, hand-approximated from general scholarship, not a surveyed border. Outside those years only the capital marker appears. Needs verification against cited atlases.<br>Sources: not yet attached per record (the seed data is pending verification against scholarly atlases).</div>
<h3>Events in this period</h3>${ev.map(e=>`<div class="it" onclick="setY(${e[0]})">${fmt(e[0])} — ${e[1]}${e[2]?" (date uncertain)":""}</div>`).join("")||"<div class='sub'>None recorded yet.</div>"}
<h3>Rulers, culture, territorial history</h3><div class="sub">Stage 4 content: not yet populated.</div>`;return}
let h=`<b>${A.length} documented entities active in ${fmt(y)}</b><div class="sub">Coverage is incomplete; absence here is not proof of absence.</div>`;
Object.keys(CAT).forEach(k=>{const L=A.filter(d=>d.cat==k&&(!q||(d.name+d.dyn+d.cap).toLowerCase().includes(q)));if(L.length)h+=`<h3>${CAT[k][0]}</h3>`+L.map(d=>`<div class="it" onclick="pick('${d.id}')"><b>${d.name}</b><small>${d.dyn} · ${d.cap} · c. ${fmt(d.s)}–${fmt(d.e)}</small></div>`).join("")});
if(q){const E=EV.filter(e=>e[1].toLowerCase().includes(q));if(E.length)h+="<h3>Events (all years)</h3>"+E.map(e=>`<div class="it" onclick="setY(${e[0]})">${fmt(e[0])} — ${e[1]}</div>`).join("");
const O=D.filter(d=>!(d.s<=y&&y<=d.e)&&(d.name+d.dyn+d.cap).toLowerCase().includes(q));if(O.length)h+="<h3>Other years</h3>"+O.map(d=>`<div class="it" onclick="setY(${Math.max(d.s,Math.min(d.e,d.s+Math.floor((d.e-d.s)/2)))});pick('${d.id}')"><b>${d.name}</b><small>c. ${fmt(d.s)}–${fmt(d.e)}</small></div>`).join("")}
$("side").innerHTML=h}
function pick(id){sel=id;side();draw()}
function evs(){$("ev").innerHTML=EV.map(e=>`<button class="ev ${Math.abs(e[0]-y)<25?"on":""}" onclick="setY(${e[0]})">${fmt(e[0])} · ${e[1]}${e[2]?" ?":""}</button>`).join("")}
function setY(v,keep){y=Math.max(-999,Math.min(2026,Math.round(v)));if(!keep)pos=y;$("sl").value=y;$("yr").textContent=fmt(y);if(sel&&!D.find(d=>d.id==sel&&d.s<=y&&y<=d.e))sel=null;draw();side();evs()}
$("sl").oninput=e=>setY(+e.target.value);$("pv").onclick=()=>setY(y-1);$("nx").onclick=()=>setY(y+1);
$("per").onchange=e=>setY(+e.target.value);
$("go").onclick=()=>{const v=parse($("jy").value);if(v===null||v<-999||v>2026)alert("Enter a year such as 261 BCE or 1526 CE (1000 BCE–2026 CE). There is no year 0.");else setY(v)};
$("jy").onkeydown=e=>{if(e.key=="Enter")$("go").click()};
$("pp").onclick=()=>{if(timer){clearInterval(timer);timer=null;$("pp").textContent="▶ Play"}else{$("pp").textContent="❚❚ Pause";if(y>=2026)pos=-999;timer=setInterval(()=>{pos+=+$("sp").value/10;if(pos>=2026){pos=2026;$("pp").click()}if(Math.round(pos)!=y)setY(pos,1)},100)}};
let t;$("q").oninput=()=>{clearTimeout(t);t=setTimeout(()=>{sel=null;side()},200)};

$("abt").onclick=()=>{$("mb").innerHTML=`<h2>Sources &amp; methodology</h2>
<p><b>Dates.</b> Internally every year is an astronomical year number (1 CE = 1, 1 BCE = 0, 2 BCE = −1). Display converts BCE n to 1 − n, so the calendar’s missing year 0 never appears. Input accepts “261 BCE” or “1526 CE”.</p>
<p><b>Geometry.</b> Territories are INDICATIVE shapes for peak periods, hand-approximated and not yet source-verified (Maurya under Ashoka is the convex hull of edict find-spots). Entities without a shape appear as capital markers; modern nations rely on the base map’s borders. Territorial polygons will be added only with a cited source, valid-from/valid-to dates, a confidence level and relationship type (direct rule, tributary, claimed, campaign). Missing boundaries are never invented.</p>
<p><b>Confidence.</b> High: strong documentary, archaeological or scholarly support. Medium: reasonably supported with chronological or geographical uncertainty. Low: tentative or contested (shown with a dashed ring). Unknown: insufficient information.</p>
<p><b>Selection.</b> Entities are seed records assembled from general scholarship and are <b>not yet verified record by record</b>. Intended references for verification: J. E. Schwartzberg, <i>A Historical Atlas of South Asia</i>; the <i>Cambridge History of India</i>; Romila Thapar’s and R. S. Sharma’s surveys; archaeological literature. Archaeological cultures (e.g., Indus-era or Painted Grey Ware) are not shown as kingdoms.</p>
<p><b>Known gaps.</b> Rulers, culture, territorial history, trade routes, cities, coastlines and modern borders layers are not yet populated; many contemporary polities (Kamboja, Matsya, Chedi, Assaka, Surasena, Anga, Eastern Chalukya, Paramara, Chahamana, Gahadavala, Sena, Rajput states, Deccan Sultanates, many princely states) are still to be added.</p>
<button onclick="$('modal').style.display='none'">Close</button>`;$("modal").style.display="flex"};
$("modal").onclick=e=>{if(e.target.id=="modal")e.target.style.display="none"};
